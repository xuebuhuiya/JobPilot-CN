<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPilot CN · 求职工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="/">J<span>JobPilot <small>CN</small></span></a><div class="workspace">个人求职空间 <span class="dot"></span></div><nav><button class="nav active" data-view="jobs">▦　岗位工作台</button><button class="nav" data-view="contacts">◌　沟通记录 <span id="contact-count"></span></button><button class="nav" data-view="activity">↗　操作记录</button></nav><div class="side-bottom"><div class="local">● 本地私有工作台</div><p>资料与记录保存在本机</p><a href="http://127.0.0.1:8686/config" target="_blank" rel="noreferrer">打开采集工具 ↗</a></div></aside>
<main><header><div><div class="eyebrow">YOUR NEXT CHAPTER</div><h1 id="page-title">把机会，变成下一步。</h1><p id="subtitle">先看资格，再看匹配。每一次选择都有据可查。</p></div><button id="sync" class="primary">↻ 同步岗位</button></header><div id="notice" role="status" aria-live="polite"></div><section id="stats" class="stats"></section>
<section id="jobs-view"><div class="toolbar"><div class="tabs" id="tabs"></div><input id="search" type="search" placeholder="搜索公司、岗位或关键词" aria-label="搜索岗位"></div><div class="filters"><select id="decision" aria-label="筛选资格状态"></select><select id="review-filter" aria-label="筛选审阅状态"></select><select id="sort" aria-label="排序"><option value="recommended">资格优先</option><option value="score">评分从高到低</option></select><span id="result-count"></span></div><div class="job-layout"><div id="job-list" class="job-list"></div><article id="detail" class="detail"></article></div></section>
<section id="contacts-view" hidden><div class="section-heading"><div><h2>沟通有记录，跟进有方向</h2><p>打招呼、发送简历与正式投递分别记录。岗位不明确时可稍后关联。</p></div><button class="primary" id="new-contact">＋ 记录沟通</button></div><div id="contacts-list"></div></section>
<section id="activity-view" hidden><div class="section-heading"><div><h2>每一步都有迹可循</h2><p>保留最近 300 条导入、审阅与状态变更记录。</p></div></div><div id="activity-list"></div></section>
<footer><span>JobPilot CN · 个人求职工作台</span><span id="rules"></span></footer></main>
<dialog id="contact-dialog"><form id="contact-form"><div class="dialog-head"><h2>记录已发生的沟通</h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div><label>公司<input name="company" required maxlength="200"></label><label>联系人<input name="person" maxlength="100"></label><label>具体岗位<select name="job_key"></select></label><div class="form-row"><label>沟通类型<select name="kind"></select></label><label>发生时间<input name="occurred_at" type="datetime-local" required></label></div><label>记录 / 依据<textarea name="note" required maxlength="4000" placeholder="例如：本人已在 BOSS 向该岗位 HR 打招呼，等待回复。"></textarea></label><p class="hint">这里只保存记录，不会向招聘方发送任何消息。</p><button class="primary" type="submit">保存沟通记录</button></form></dialog>
</body></html>
